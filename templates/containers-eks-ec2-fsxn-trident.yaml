AWSTemplateFormatVersion: '2010-09-09'
Description: >
  Config 2 - Amazon EKS with an EC2 managed node group and the NetApp Trident
  EKS add-on, for provisioning Amazon FSx for NetApp ONTAP persistent volumes
  (NFS via ontap-nas, iSCSI via ontap-san). Cluster + node group + add-on only;
  the FSx for ONTAP file system and SVM are referenced by parameter. Static
  verification target (cfn-lint); not deployed.

# The `Project` tag value below is a cost-allocation tag string for this
# repository (aws-container-datastore-patterns). It is a cost tag, not a
# reference to the GitHub repository name.

# ==============================================================================
# Why this shape, and what CloudFormation cannot do here
# ==============================================================================
# The EKS + FSx for ONTAP integration is NetApp Trident (a CSI driver). AWS's EKS
# User Guide points to Trident as the mechanism. Trident runs a controller pod
# plus a node pod (DaemonSet) on each worker node, so it needs EC2 worker nodes;
# it cannot run on Fargate (Fargate forbids DaemonSets and privileged pods). That
# is why this template creates a managed node group, not a Fargate profile.
#
# CloudFormation can create the cluster, the node group, and the Trident EKS
# add-on. It CANNOT create the Kubernetes objects that make a PV appear:
#   - TridentBackendConfig (points Trident at the FSx SVM + Secrets Manager creds)
#   - StorageClass (ontap-nas for NFS, or ontap-san for iSCSI)
#   - PersistentVolumeClaim
# Those are applied with kubectl/Helm after the stack completes. See the Outputs
# and docs/ja|en/atx-containerization-fsxn-storage-verification.md for the
# follow-up steps.
#
# iSCSI note: ontap-san needs the iSCSI and multipath tools on every node, and
# the Amazon Linux 2023 EKS AMI ships none of them (nfs-utils is present). With
# PrepareNodesForIscsi=true a launch template installs them at first boot and
# writes /etc/multipath.conf with find_multipaths no and the EBS devices
# blacklisted, so multipath does not claim EBS volumes when the EBS CSI driver is
# also in use. Trident detects iSCSI when its node pod starts; if a node pod
# started before the tools existed, restart the trident-node-linux DaemonSet.
Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label:
          default: Network (existing, referenced)
        Parameters:
          - Subnet1Id
          - Subnet2Id
      - Label:
          default: EKS cluster and node group
        Parameters:
          - ClusterName
          - KubernetesVersion
          - NodeInstanceType
          - NodeDesiredSize
          - PrepareNodesForIscsi
      - Label:
          default: FSx for ONTAP (existing, referenced)
        Parameters:
          - FsxnSecurityGroupId
          - TridentAddonVersion

Parameters:

  Subnet1Id:
    Type: AWS::EC2::Subnet::Id
    Description: >
      Private subnet 1 for the EKS control plane ENIs and nodes. It must be in the
      same VPC as the FSx for ONTAP file system, and have a route to ECR and to the
      Amazon Linux package repository (a NAT gateway or VPC endpoints).

  Subnet2Id:
    Type: AWS::EC2::Subnet::Id
    Description: Private subnet 2 (different AZ)

  ClusterName:
    Type: String
    Default: eks-ec2-fsxn-trident
    Description: Name of the EKS cluster
    AllowedPattern: '^[a-zA-Z][a-zA-Z0-9\-]{0,99}$'

  KubernetesVersion:
    Type: String
    Description: >
      EKS Kubernetes version, for example 1.35. There is no default: a default
      goes stale (a version moves from standard to extended support, which is
      billed at a higher cluster rate) without any change to this file. List the
      versions in standard support with
      aws eks describe-cluster-versions --query 'clusterVersions[?status==`STANDARD_SUPPORT`].clusterVersion'
      and check the Trident add-on's supported range with
      aws eks describe-addon-versions --addon-name netapp_trident-operator --kubernetes-version <version>
    AllowedPattern: '^1\.(2[6-9]|3[0-9])$'

  NodeInstanceType:
    Type: String
    Default: m5.large
    Description: EC2 instance type for the managed node group

  NodeDesiredSize:
    Type: Number
    Default: 2
    MinValue: 1
    Description: Desired number of worker nodes
  PrepareNodesForIscsi:
    Type: String
    Default: 'true'
    AllowedValues:
      - 'true'
      - 'false'
    Description: >
      When true, a launch template installs the iSCSI and multipath tools on each
      node at first boot and writes /etc/multipath.conf (find_multipaths no, EBS
      devices blacklisted). Needed for ontap-san. Set false if you only use
      ontap-nas. The script targets the Amazon Linux 2023 EKS AMI (dnf, systemd).

  FsxnSecurityGroupId:
    Type: AWS::EC2::SecurityGroup::Id
    Description: >
      Security group attached to the FSx for ONTAP file system. This template
      adds ingress on it for NFS (2049) and iSCSI (3260) from the node security
      group so Trident-provisioned volumes can be mounted.

  TridentAddonVersion:
    Type: String
    Default: 'DEFAULT'
    Description: >
      Version of the NetApp Trident EKS add-on, e.g. v25.6.0-eksbuild.1. Leave as
      DEFAULT to let EKS pick the default version. Confirm the current addon name
      and versions with:
      aws eks describe-addon-versions --addon-name netapp_trident-operator

Conditions:
  UseDefaultAddonVersion: !Equals [!Ref TridentAddonVersion, 'DEFAULT']
  PrepareIscsi: !Equals [!Ref PrepareNodesForIscsi, 'true']

Resources:

  # ---------- IAM: cluster role ----------
  ClusterRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: eks.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonEKSClusterPolicy
      Tags:
        - Key: Project
          Value: aws-container-datastore-patterns

  # ---------- IAM: node role ----------
  NodeRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonEKSWorkerNodePolicy
        - arn:aws:iam::aws:policy/AmazonEKS_CNI_Policy
        - arn:aws:iam::aws:policy/AmazonEC2ContainerRegistryReadOnly
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
      Tags:
        - Key: Project
          Value: aws-container-datastore-patterns

  # ---------- FSx for ONTAP security group ingress ----------
  # The source is the EKS cluster security group, which EKS creates with the
  # cluster and attaches to the managed nodes. A security group passed in
  # ResourcesVpcConfig.SecurityGroupIds is NOT attached to the nodes: it applies
  # to the control-plane network interfaces only. A source of that kind would
  # not match the nodes' traffic, and the stack would still succeed.
  # Port 443 is for the Trident backend, which calls the SVM management endpoint.
  FsxnManagementIngressFromNodes:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref FsxnSecurityGroupId
      IpProtocol: tcp
      FromPort: 443
      ToPort: 443
      SourceSecurityGroupId: !GetAtt EksCluster.ClusterSecurityGroupId
      Description: ONTAP REST from EKS worker nodes (Trident backend)

  FsxnNfsIngressFromNodes:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref FsxnSecurityGroupId
      IpProtocol: tcp
      FromPort: 2049
      ToPort: 2049
      SourceSecurityGroupId: !GetAtt EksCluster.ClusterSecurityGroupId
      Description: NFS from EKS worker nodes (Trident ontap-nas)

  FsxnIscsiIngressFromNodes:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref FsxnSecurityGroupId
      IpProtocol: tcp
      FromPort: 3260
      ToPort: 3260
      SourceSecurityGroupId: !GetAtt EksCluster.ClusterSecurityGroupId
      Description: iSCSI from EKS worker nodes (Trident ontap-san)

  # ---------- EKS cluster ----------
  EksCluster:
    Type: AWS::EKS::Cluster
    Properties:
      Name: !Ref ClusterName
      Version: !Ref KubernetesVersion
      RoleArn: !GetAtt ClusterRole.Arn
      ResourcesVpcConfig:
        SubnetIds:
          - !Ref Subnet1Id
          - !Ref Subnet2Id
      # Pod Identity uses an on-cluster agent add-on; IRSA (OIDC) is the portable
      # choice and is what the Fargate S3-access-point template also relies on.
      AccessConfig:
        AuthenticationMode: API_AND_CONFIG_MAP
      Tags:
        - Key: Project
          Value: aws-container-datastore-patterns

  # ---------- OIDC provider for IRSA ----------
  # Enables IAM Roles for Service Accounts, so Trident (and application pods) can
  # assume scoped IAM roles. Required if Trident authenticates to the FSx API with
  # an IAM-based credential rather than a Secrets Manager username/password.
  OidcProvider:
    Type: AWS::IAM::OIDCProvider
    Properties:
      Url: !GetAtt EksCluster.OpenIdConnectIssuerUrl
      ClientIdList:
        - sts.amazonaws.com
      # EKS OIDC thumbprint. AWS documents this well-known value; STS validation
      # does not depend on it, but the field is required by the resource type.
      ThumbprintList:
        - '9e99a48a9960b14926bb7f3b02e22da2b0ab7280'
      Tags:
        - Key: Project
          Value: aws-container-datastore-patterns

  # ---------- Node preparation for iSCSI (ontap-san) ----------
  # User data must be MIME multipart for a managed node group launch template.
  # EKS merges its own node bootstrap with it, so no AMI is set here. The script
  # is for Amazon Linux 2023 (dnf, systemd). If dnf cannot reach its repository
  # the script stops, the node still joins the cluster, and the tools are missing:
  # check /var/log/cloud-init-output.log or systemctl is-active iscsid multipathd.
  NodeLaunchTemplate:
    Type: AWS::EC2::LaunchTemplate
    Condition: PrepareIscsi
    Properties:
      LaunchTemplateData:
        UserData:
          Fn::Base64: |
            MIME-Version: 1.0
            Content-Type: multipart/mixed; boundary="//"

            --//
            Content-Type: text/x-shellscript; charset="us-ascii"

            #!/bin/bash
            set -euo pipefail
            dnf install -y lsscsi iscsi-initiator-utils device-mapper-multipath
            sed -i 's/^\(node.session.scan\).*/\1 = manual/' /etc/iscsi/iscsid.conf
            cat > /etc/multipath.conf <<'CONF'
            defaults {
                find_multipaths no
            }
            blacklist {
                device {
                    vendor "NVME"
                    product "Amazon Elastic Block Store"
                }
            }
            CONF
            systemctl enable --now iscsid multipathd
            --//--

  # ---------- Managed node group (EC2 workers, required for Trident) ----------
  NodeGroup:
    Type: AWS::EKS::Nodegroup
    Properties:
      ClusterName: !Ref EksCluster
      NodeRole: !GetAtt NodeRole.Arn
      Subnets:
        - !Ref Subnet1Id
        - !Ref Subnet2Id
      InstanceTypes:
        - !Ref NodeInstanceType
      LaunchTemplate: !If
        - PrepareIscsi
        - Id: !Ref NodeLaunchTemplate
          Version: !GetAtt NodeLaunchTemplate.LatestVersionNumber
        - !Ref 'AWS::NoValue'
      ScalingConfig:
        MinSize: 1
        DesiredSize: !Ref NodeDesiredSize
        MaxSize: 4
      Tags:
        Project: aws-container-datastore-patterns

  # ---------- NetApp Trident EKS add-on ----------
  # Marketplace EKS add-on. Confirm the current addon name and versions with
  #   aws eks describe-addon-versions --addon-name netapp_trident-operator
  # before deploying; the vendor's addon name can change.
  TridentAddon:
    Type: AWS::EKS::Addon
    Properties:
      ClusterName: !Ref EksCluster
      AddonName: netapp_trident-operator
      AddonVersion: !If [UseDefaultAddonVersion, !Ref 'AWS::NoValue', !Ref TridentAddonVersion]
      ResolveConflicts: OVERWRITE
      Tags:
        - Key: Project
          Value: aws-container-datastore-patterns
    DependsOn: NodeGroup

Outputs:
  ClusterName:
    Description: EKS cluster name
    Value: !Ref EksCluster

  ClusterOidcIssuer:
    Description: OIDC issuer URL (for IRSA role trust policies)
    Value: !GetAtt EksCluster.OpenIdConnectIssuerUrl

  ClusterSecurityGroupId:
    Description: >
      EKS cluster security group, the one attached to the managed nodes and the
      source of the FSx for ONTAP ingress rules this template adds
    Value: !GetAtt EksCluster.ClusterSecurityGroupId

  NextSteps:
    Description: Kubernetes objects to apply after the stack completes
    Value: >
      1) kubectl apply TridentBackendConfig (ontap-nas or ontap-san) referencing
      the FSx SVM + Secrets Manager creds; 2) kubectl apply StorageClass
      (provisioner csi.trident.netapp.io); 3) create a PVC from the StorageClass.
      Before step 1 with ontap-san, confirm the nodes have the iSCSI tools
      (systemctl is-active iscsid multipathd on a node, through SSM) and that
      kubectl get pods -n trident shows the node pods running after that.
