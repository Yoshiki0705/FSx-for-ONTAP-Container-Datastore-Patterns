name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  # Every step calls a Makefile target. Path lists live in Makefile variables
  # and the tool version in requirements-dev.txt, so CI and a local run cannot
  # inspect different trees with different tools.
  gates:
    name: Gates (cfn-lint / headings / role-labels)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      - name: Install pinned tooling
        run: make install

      # Each target runs its detector's own selftest first, so a rule that
      # stopped matching fails the job instead of reporting an empty result as a
      # pass. cfn-lint exits 4 on warnings, which the target treats as failure.
      - name: Run gates
        run: make ci
