<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" font-family="Helvetica, Arial, 'Noto Sans', sans-serif">
  <!-- Background: near-black, deliberately distinct from AWS navy (#232F3E) -->
  <rect width="1280" height="640" fill="#0B0B0D"/>

  <!-- Thin restrained accent rule under the title block -->
  <rect x="80" y="356" width="132" height="5" fill="#FFFFFF"/>

  <!-- Title -->
  <text x="80" y="212" fill="#FFFFFF" font-size="82" font-weight="800">ONTAP as a</text>
  <text x="80" y="308" fill="#FFFFFF" font-size="82" font-weight="800">Container Data Store</text>

  <!-- 'on AWS' set apart in muted grey to keep the platform secondary -->
  <text x="80" y="404" fill="#9AA0A6" font-size="46" font-weight="600">on AWS</text>

  <!-- Subtitle -->
  <text x="80" y="466" fill="#C4C7CC" font-size="34" font-weight="500">5 patterns for Amazon ECS / EKS</text>

  <!-- Keyword chips (muted, low-contrast borders) -->
  <g font-size="28" font-weight="600">
    <g>
      <rect x="80"  y="512" width="112" height="54" rx="27" fill="#17181B" stroke="#33353A"/>
      <text x="136" y="547" fill="#E8EAED" text-anchor="middle">ECS</text>
    </g>
    <g>
      <rect x="208" y="512" width="112" height="54" rx="27" fill="#17181B" stroke="#33353A"/>
      <text x="264" y="547" fill="#E8EAED" text-anchor="middle">EKS</text>
    </g>
    <g>
      <rect x="336" y="512" width="164" height="54" rx="27" fill="#17181B" stroke="#33353A"/>
      <text x="418" y="547" fill="#E8EAED" text-anchor="middle">Fargate</text>
    </g>
    <g>
      <rect x="516" y="512" width="184" height="54" rx="27" fill="#17181B" stroke="#33353A"/>
      <text x="608" y="547" fill="#E8EAED" text-anchor="middle">NFS / SMB</text>
    </g>
    <g>
      <rect x="716" y="512" width="228" height="54" rx="27" fill="#17181B" stroke="#33353A"/>
      <text x="830" y="547" fill="#E8EAED" text-anchor="middle">NetApp Trident</text>
    </g>
    <g>
      <rect x="960" y="512" width="256" height="54" rx="27" fill="#17181B" stroke="#33353A"/>
      <text x="1088" y="547" fill="#E8EAED" text-anchor="middle">S3 Access Points</text>
    </g>
  </g>

  <!-- Footer handle -->
  <text x="1200" y="600" fill="#6C7075" font-size="24" font-weight="500" text-anchor="end">github.com/Yoshiki0705</text>
</svg>
